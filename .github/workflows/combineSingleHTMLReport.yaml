name: Build combined HTML from multiple units

on:
  workflow_dispatch:

jobs:
  generate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate combined HTML report
        shell: bash
        run: |
          set -euo pipefail
          
          JSON_FILE="sample.json"
          OUT="combined-config-report.html"

          # Start HTML file
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en">' \
            '<head>' \
            '  <meta charset="utf-8" />' \
            '  <title>Combined Configuration Report</title>' \
            '  <style>' \
            '    body { font-family: Arial, sans-serif; margin: 2rem; }' \
            '    h1 { margin-bottom: 1rem; }' \
            '    table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; }' \
            '    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }' \
            '    th { background-color: #f4f4f4; }' \
            '    code { background: #f6f8fa; padding: 0.1rem 0.3rem; border-radius: 4px; }' \
            '    .subtitle { color: #666; font-size: 0.9em; margin-top: -0.5rem; margin-bottom: 1rem; }' \
            '  </style>' \
            '</head>' \
            '<body>' \
            '  <h1>Combined Configuration Report</h1>' > "$OUT"

          # Loop through each JSON entry (unit + code)
          jq -c '.[]' "$JSON_FILE" | while read -r entry; do
            UNIT=$(echo "$entry" | jq -r '.unit')
            CODE=$(echo "$entry" | jq -r '.code')
            UNIT_LOWER=$(echo "$UNIT" | tr '[:upper:]' '[:lower:]')
            PROPS_FILE="${UNIT_LOWER}-values.properties"

            if [[ ! -f "$PROPS_FILE" ]]; then
              printf '  <h2>%s</h2>\n' "$UNIT" >> "$OUT"
              printf '  <p class="subtitle">Code: %s</p>\n' "$CODE" >> "$OUT"
              printf '  <p><em>No properties file found.</em></p>\n' >> "$OUT"
              continue
            fi

            # Add section header for the unit + code
            printf '  <h2>%s</h2>\n' "$UNIT" >> "$OUT"
            printf '  <p class="subtitle">Code: %s</p>\n' "$CODE" >> "$OUT"
            printf '  <table>\n    <thead><tr><th>Key</th><th>%s</th></tr></thead>\n    <tbody>\n' "$UNIT" >> "$OUT"

            # Append rows from properties file
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
              key="${line%%=*}"
              value="${line#*=}"
              # Trim whitespace
              key="${key#"${key%%[![:space:]]*}"}"; key="${key%"${key##*[![:space:]]}"}"
              value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"
              [[ -z "$key" ]] && continue
              # Escape HTML
              k="${key//&/&amp;}"; k="${k//</&lt;}"; k="${k//>/&gt;}"
              v="${value//&/&amp;}"; v="${v//</&lt;}"; v="${v//>/&gt;}"
              printf '      <tr><td><code>%s</code></td><td>%s</td></tr>\n' "$k" "$v" >> "$OUT"
            done < "$PROPS_FILE"

            printf '    </tbody>\n  </table>\n' >> "$OUT"
          done

          # End HTML
          printf '%s\n' \
            '</body>' \
            '</html>' >> "$OUT"

          echo "Wrote $OUT"

      - name: Upload combined HTML report
        uses: actions/upload-artifact@v4
        with:
          name: combined-config-report
          path: combined-config-report.html
