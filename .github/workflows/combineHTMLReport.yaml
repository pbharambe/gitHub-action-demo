name: Build HTML from multiple units

on:
  workflow_dispatch:

jobs:
  generate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate HTML reports for each unit
        shell: bash
        run: |
          set -euo pipefail

          JSON_FILE="sample.json"

          # Extract units from JSON array: [{ "unit": "AB" }, ...]
          jq -r '.[].unit' "$JSON_FILE" | while read -r UNIT; do
            UNIT_LOWER=$(echo "$UNIT" | tr '[:upper:]' '[:lower:]')
            PROPS_FILE="${UNIT_LOWER}-values.properties"
            OUT="${UNIT_LOWER}-config-report.html"

            if [[ ! -f "$PROPS_FILE" ]]; then
              echo "WARNING: No properties file for unit '$UNIT' (${PROPS_FILE}); skipping."
              continue
            fi

            # Start HTML (no heredocs to avoid YAML issues)
            printf '%s\n' \
              '<!doctype html>' \
              '<html lang="en">' \
              '<head>' \
              '  <meta charset="utf-8" />' \
              "  <title>Configuration Report - ${UNIT}</title>" \
              '  <style>' \
              '    body { font-family: Arial, sans-serif; margin: 2rem; }' \
              '    h1 { margin-bottom: 1rem; }' \
              '    table { border-collapse: collapse; width: 100%; }' \
              '    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }' \
              '    th { background-color: #f4f4f4; }' \
              '    code { background: #f6f8fa; padding: 0.1rem 0.3rem; border-radius: 4px; }' \
              '  </style>' \
              '</head>' \
              '<body>' \
              "  <h1>Configuration Report - ${UNIT}</h1>" \
              '  <table>' \
              "    <thead><tr><th>Key</th><th>${UNIT}</th></tr></thead>" \
              '    <tbody>' > "$OUT"

            # Append rows from properties (skip blanks/comments)
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
              key="${line%%=*}"
              value="${line#*=}"
              # Trim whitespace
              key="${key#"${key%%[![:space:]]*}"}"; key="${key%"${key##*[![:space:]]}"}"
              value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"
              [[ -z "$key" ]] && continue
              # Basic HTML escaping
              k="${key//&/&amp;}"; k="${k//</&lt;}"; k="${k//>/&gt;}"
              v="${value//&/&amp;}"; v="${v//</&lt;}"; v="${v//>/&gt;}"
              printf '      <tr><td><code>%s</code></td><td>%s</td></tr>\n' "$k" "$v" >> "$OUT"
            done < "$PROPS_FILE"

            # Close HTML
            printf '%s\n' \
              '    </tbody>' \
              '  </table>' \
              '</body>' \
              '</html>' >> "$OUT"

            echo "Wrote ${OUT}"
          done

      - name: Upload all HTML reports
        uses: actions/upload-artifact@v4
        with:
          name: config-reports
          path: "*.html"
