name: Build combined HTML from multiple units (only URL)

on:
  workflow_dispatch:

jobs:
  generate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate combined HTML report (URL only)
        shell: bash
        run: |
          set -euo pipefail
          
          JSON_FILE="sample.json"
          OUT="combined-config-report.html"

          # Start HTML file
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en">' \
            '<head>' \
            '  <meta charset="utf-8" />' \
            '  <title>Combined URL Report</title>' \
            '  <style>' \
            '    body { font-family: Arial, sans-serif; margin: 2rem; }' \
            '    h1 { margin-bottom: 1rem; }' \
            '    table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; }' \
            '    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }' \
            '    th { background-color: #f4f4f4; }' \
            '    code { background: #f6f8fa; padding: 0.1rem 0.3rem; border-radius: 4px; }' \
            '  </style>' \
            '</head>' \
            '<body>' \
            '  <h1>Combined URL Report</h1>' > "$OUT"

          # Loop through each JSON entry (unit + code)
          jq -c '.[]' "$JSON_FILE" | while read -r entry; do
            UNIT=$(echo "$entry" | jq -r '.unit')
            CODE=$(echo "$entry" | jq -r '.code')
            UNIT_LOWER=$(echo "$UNIT" | tr '[:upper:]' '[:lower:]')
            PROPS_FILE="${UNIT_LOWER}-values.properties"

            if [[ ! -f "$PROPS_FILE" ]]; then
              printf '  <h2>%s</h2>\n' "$UNIT" >> "$OUT"
              printf '  <p><em>No properties file found.</em></p>\n' >> "$OUT"
              continue
            fi

            # Extract only URL key
            URL_VALUE=$(grep -E '^app\.url=' "$PROPS_FILE" | cut -d'=' -f2- | xargs)

            # Add section header with table
            printf '  <h2>%s</h2>\n' "$UNIT" >> "$OUT"
            printf '  <table>\n    <thead><tr><th>URL</th></tr></thead>\n    <tbody>\n' >> "$OUT"
            printf '      <tr><td>%s</td></tr>\n' "$URL_VALUE" >> "$OUT"
            printf '    </tbody>\n  </table>\n' >> "$OUT"
          done

          # End HTML
          printf '%s\n' \
            '</body>' \
            '</html>' >> "$OUT"

          echo "Wrote $OUT"

      - name: Upload combined HTML report
        uses: actions/upload-artifact@v4
        with:
          name: combined-config-report
          path: combined-config-report.html
