name: Read property and JSON files

on:
  workflow_dispatch:

jobs:
  read-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read .properties file
        id: read_props
        run: |
          while IFS='=' read -r key value; do
            if [[ -n "$key" && ! "$key" =~ ^# ]]; then
              # Replace dots with underscores for valid output names
              safe_key=$(echo "$key" | tr '.' '_' )
              echo ${value}
              echo "${safe_key}=${value}" >> $GITHUB_OUTPUT
            fi
          done < config.properties

      - name: Read JSON file
        id: read_json
        run: |
          my_value=$(jq -r '.someKey' config.json)
          echo ${my_value}
          echo "my_value=${my_value}" >> $GITHUB_OUTPUT

      - name: Use the outputs
        run: |
          echo "Property from props file: ${{ steps.read_props.outputs.username }}"
          echo "Value from JSON file: ${{ steps.read_json.outputs.my_value }}"
