name: Build HTML from unit-based properties

on:
  workflow_dispatch:

jobs:
  generate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate HTML based on unit
        run: |
          set -euo pipefail
          
          JSON_FILE="sample.json"
          OUT="config-report.html"

          # Read unit from JSON (convert to lowercase for file naming)
          UNIT=$(jq -r '.unit' "$JSON_FILE")
          UNIT_LOWER=$(echo "$UNIT" | tr '[:upper:]' '[:lower:]')

          # Determine properties file name
          PROPS_FILE="${UNIT_LOWER}-values.properties"

          if [[ ! -f "$PROPS_FILE" ]]; then
            echo "ERROR: Properties file '$PROPS_FILE' not found."
            exit 1
          fi

          echo "Using properties file: $PROPS_FILE"
          
          # HTML header
          cat > "$OUT" <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>Configuration Report</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 2rem; }
              h1 { margin-bottom: 1rem; }
              table { border-collapse: collapse; width: 100%; }
              th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
              th { background-color: #f4f4f4; }
              code { background: #f6f8fa; padding: 0.1rem 0.3rem; border-radius: 4px; }
            </style>
          </head>
          <body>
            <h1>Configuration Report</h1>
            <table>
              <thead>
                <tr><th>Key</th><th>${UNIT}</th></tr>
              </thead>
              <tbody>
          HTML

          # Read properties file and append rows
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            echo "                <tr><td><code>${key}</code></td><td>${value}</td></tr>" >> "$OUT"
          done < "$PROPS_FILE"

          # Close HTML
          cat >> "$OUT" <<'HTML'
              </tbody>
            </table>
          </body>
          </html>
          HTML

          echo "Generated $OUT"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: config-report
          path: config-report.html
