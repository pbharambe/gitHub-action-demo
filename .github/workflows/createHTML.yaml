name: Build HTML from properties + JSON

on:
  workflow_dispatch: {}

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate HTML report
        shell: bash
        run: |
          set -euo pipefail

          PROPS_FILE="config.properties"
          JSON_FILE="config.json"
          OUT="config-report.html"

          # --- helpers ---
          html_escape() {
            # escape &, <, >, and "
            local s="${1//&/&amp;}"
            s="${s//</&lt;}"
            s="${s//>/&gt;}"
            s="${s//\"/&quot;}"
            printf '%s' "$s"
          }

          # Begin HTML
          cat > "$OUT" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Configuration Report</title>
            <style>
              body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 2rem; }
              h1,h2 { margin: 0 0 .5rem 0; }
              .card { border: 1px solid #ddd; border-radius: 12px; padding: 1rem; margin: 1rem 0; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
              table { width: 100%; border-collapse: collapse; }
              th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid #eee; vertical-align: top; }
              th { background: #fafafa; }
              code { background: #f6f8fa; padding: .1rem .3rem; border-radius: 6px; }
              .muted { color: #666; }
            </style>
          </head>
          <body>
            <h1>Configuration Report</h1>
            <p class="muted">Generated by GitHub Actions</p>
          HTML

          # Properties section
          echo '  <div class="card">' >> "$OUT"
          echo '    <h2>.properties</h2>' >> "$OUT"
          echo '    <table><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody>' >> "$OUT"

          if [[ -f "$PROPS_FILE" ]]; then
            # Read line-by-line, keep everything after first '=' as value
            # Skip empty lines and comments
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
              key="${line%%=*}"
              value="${line#*=}"
              # trim whitespace around key and value
              key="${key#"${key%%[![:space:]]*}"}"; key="${key%"${key##*[![:space:]]}"}"
              value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"
              [[ -z "$key" ]] && continue
              ek=$(html_escape "$key")
              ev=$(html_escape "$value")
              printf '      <tr><td><code>%s</code></td><td>%s</td></tr>\n' "$ek" "$ev" >> "$OUT"
            done < "$PROPS_FILE"
          else
            echo '      <tr><td colspan="2" class="muted">No properties file found.</td></tr>' >> "$OUT"
          fi

          echo '    </tbody></table>' >> "$OUT"
          echo '  </div>' >> "$OUT"

          # JSON section (flatten nested keys into dot paths)
          echo '  <div class="card">' >> "$OUT"
          echo '    <h2>.json</h2>' >> "$OUT"
          echo '    <table><thead><tr><th>Path</th><th>Value</th></tr></thead><tbody>' >> "$OUT"

          if [[ -f "$JSON_FILE" ]]; then
            # Output <path>\t<value> for every scalar, using dot-notation paths
            # Handles nested objects/arrays: e.g. server.hosts[0].ip
            jq -r '
              def path_to_string($p):
                $p
                | map(
                    if type=="number" then "["+tostring+"]"
                    else if test("^[A-Za-z0-9_]+$") then .
                    else "\"" + gsub("\""; "\\\"") + "\""
                    end end
                  )
                | reduce .[] as $x (""; . + (if ($x|test("^\\[")) then $x else (if .=="" then "" else "." end) + $x end));
              paths(scalars) as $p
              | [ path_to_string($p), (getpath($p)) ]
              | @tsv
            ' "$JSON_FILE" | while IFS=$'\t' read -r p v; do
              ep=$(html_escape "$p")
              ev=$(html_escape "$v")
              printf '      <tr><td><code>%s</code></td><td>%s</td></tr>\n' "$ep" "$ev" >> "$OUT"
            done
          else
            echo '      <tr><td colspan="2" class="muted">No JSON file found.</td></tr>' >> "$OUT"
          fi

          echo '    </tbody></table>' >> "$OUT"
          echo '  </div>' >> "$OUT"

          # End HTML
          cat >> "$OUT" <<'HTML'
          </body>
          </html>
          HTML

          echo "Generated $OUT"
          ls -l "$OUT"

      - name: Upload HTML as artifact
        uses: actions/upload-artifact@v4
        with:
          name: config-report
          path: config-report.html
          if-no-files-found: error
