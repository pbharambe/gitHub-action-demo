name: Copy Secrets to Another Repo

on:
  workflow_dispatch:

jobs:
  copy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v3

      - name: Install GitHub CLI
        run: |
          sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.GH_TOKEN }}" | gh auth login --with-token

      - name: Copy secrets to the destination
        env:
          SECRET_1: ${{ secrets.GH_TOKEN }}
        run: |
          gh secret set SECRET_1 --repo ${{ github.event.input.destination_repo }} --body "SECRET_1"
