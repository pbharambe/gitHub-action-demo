name: Build combined HTML (Key-Value per unit)

on:
  workflow_dispatch:

jobs:
  generate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate combined Key-Value HTML report
        shell: bash
        run: |
          set -euo pipefail
          
          JSON_FILE="sample.json"
          OUT="combined-config-report.html"

          # Start HTML
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en">' \
            '<head>' \
            '  <meta charset="utf-8" />' \
            '  <title>Combined Configuration Report</title>' \
            '  <style>' \
            '    body { font-family: Arial, sans-serif; margin: 2rem; }' \
            '    h1 { margin-bottom: 1rem; }' \
            '    table { border-collapse: collapse; width: 50%; margin-bottom: 2rem; }' \
            '    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }' \
            '    th { background-color: #f4f4f4; width: 30%; }' \
            '    code { background: #f6f8fa; padding: 0.1rem 0.3rem; border-radius: 4px; }' \
            '  </style>' \
            '</head>' \
            '<body>' \
            '  <h1>Combined Configuration Report</h1>' > "$OUT"

          # Loop through JSON
          jq -c '.[]' "$JSON_FILE" | while read -r entry; do
            UNIT=$(echo "$entry" | jq -r '.unit')
            CODE=$(echo "$entry" | jq -r '.code')
            UNIT_LOWER=$(echo "$UNIT" | tr '[:upper:]' '[:lower:]')
            PROPS_FILE="${UNIT_LOWER}-values.properties"

            URL_VALUE="N/A"
            TIMEOUT_VALUE="N/A"

            if [[ -f "$PROPS_FILE" ]]; then
              URL_VALUE=$(grep -E '^ab\.url=' "$PROPS_FILE" | cut -d'=' -f2- | xargs)
              TIMEOUT_VALUE=$(grep -E '^ab\.timeout=' "$PROPS_FILE" | cut -d'=' -f2- | xargs)
            fi

            # Section header
            printf '  <h2>%s</h2>\n' "$UNIT" >> "$OUT"

            # Key–Value table
            printf '  <table>\n' >> "$OUT"
            printf '    <tr><th>Key</th><th>Value</th></tr>\n' >> "$OUT"
            printf '    <tr><td>Code</td><td>%s</td></tr>\n' "$CODE" >> "$OUT"
            printf '    <tr><td>URL</td><td>%s</td></tr>\n' "$URL_VALUE" >> "$OUT"
            printf '    <tr><td>Timeout</td><td>%s</td></tr>\n' "$TIMEOUT_VALUE" >> "$OUT"
            printf '  </table>\n' >> "$OUT"

          done

          # Close HTML
          printf '%s\n' \
            '</body>' \
            '</html>' >> "$OUT"

          echo "Wrote $OUT"

      - name: Upload combined HTML report
        uses: actions/upload-artifact@v4
        with:
          name: combined-config-report
          path: combined-config-report.html
