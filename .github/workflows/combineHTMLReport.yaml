name: Build HTML from multiple units

on:
  workflow_dispatch:

jobs:
  generate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate HTML reports for each unit
        shell: bash
        run: |
          set -euo pipefail
          
          JSON_FILE="sample.json"

          # Extract all unit values from JSON
          jq -r '.[].unit' "$JSON_FILE" | while read -r UNIT; do
            UNIT_LOWER=$(echo "$UNIT" | tr '[:upper:]' '[:lower:]')
            PROPS_FILE="${UNIT_LOWER}-values.properties"
            OUT="${UNIT_LOWER}-config-report.html"

            if [[ ! -f "$PROPS_FILE" ]]; then
              echo "WARNING: No properties file found for unit '$UNIT' ($PROPS_FILE), skipping."
              continue
            fi

            echo "Generating report for $UNIT using $PROPS_FILE"

            # Write HTML header
cat > "$OUT" <<'HTML'
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Configuration Report</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    h1 { margin-bottom: 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
    code { background: #f6f8fa; padding: 0.1rem 0.3rem; border-radius: 4px; }
  </style>
</head>
<body>
HTML

            # Insert dynamic title and table header
            echo "  <h1>Configuration Report - ${UNIT}</h1>" >> "$OUT"
            echo "  <table>" >> "$OUT"
            echo "    <thead><tr><th>Key</th><th>${UNIT}</th></tr></thead>" >> "$OUT"
            echo "    <tbody>" >> "$OUT"

            # Append property rows
            while IFS='=' read -r key value; do
              [[ -z "$key" || "$key" =~ ^# ]] && continue
              echo "      <tr><td><code>${key}</code></td><td>${value}</td></tr>" >> "$OUT"
            done < "$PROPS_FILE"

            # Close table and HTML
cat >> "$OUT" <<'HTML'
    </tbody>
  </table>
</body>
</html>
HTML

          done

      - name: Upload all HTML reports
        uses: actions/upload-artifact@v4
        with:
          name: config-reports
          path: "*.html"
