name: Read property and JSON files

on:
  workflow_dispatch:

jobs:
  read-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read all .properties key-values
        run: |
          echo "---- Properties file ----"
          while IFS='=' read -r key value; do
            if [[ -n "$key" && ! "$key" =~ ^# ]]; then
              echo "Key: $key | Value: $value"
            fi
          done < config.properties

      - name: Read all JSON key-values
        run: |
          echo "---- JSON file ----"
          # jq will print "key=value" lines for each field
          jq -r 'to_entries[] | "\(.key)=\(.value)"' config.json |
          while IFS='=' read -r key value; do
            echo "Key: $key | Value: $value"
          done
