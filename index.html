<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Configuration Report</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    h1 { margin-bottom: 1rem; }
    table { border-collapse: collapse; width: 50%; margin-bottom: 2rem; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; width: 30%; }
    .na { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Configuration Report</h1>
  <h2>AB</h2>
  <table>
    <tr><th>Key</th><th>Value</th></tr>
    <tr><td>Code</td><td>A</td></tr>
    <tr><td>URL</td><td>abc.com</td></tr>
    <tr><td>Timeout</td><td>35</td></tr>
  </table>
  <h2>CD</h2>
  <table>
    <tr><th>Key</th><th>Value</th></tr>
    <tr><td>Code</td><td>C</td></tr>
    <tr><td>URL</td><td>xyz.com</td></tr>
    <tr><td>Timeout</td><td>40</td></tr>
  </table>
  <h2>EF</h2>
  <table>
    <tr><th>Key</th><th>Value</th></tr>
    <tr><td>Code</td><td>E</td></tr>
    <tr><td>URL</td><td class="na">N/A</td></tr>
    <tr><td>Timeout</td><td class="na">N/A</td></tr>
  </table>
</body>
</html>
